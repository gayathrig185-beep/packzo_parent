status = warn
name = CatalogAppLogs

# ===============================
# Console Appender
# ===============================
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

# ===============================
# File Appender
# ===============================
appender.file.type = RollingFile
appender.file.name = FileAppender
appender.file.fileName = logs/catalog-app.log
appender.file.filePattern = logs/catalog-app-%d{yyyy-MM-dd}.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

# Rotation Policy
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1

# ===============================
# Root Logger
# ===============================
rootLogger.level = info
rootLogger.appenderRefs = console,file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

# ===============================
# Application package logging
# ===============================
logger.catalog.name = com.example.catalog
logger.catalog.level = debug
